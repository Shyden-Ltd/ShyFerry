[project]
name = "shyferry"
version = "0.1.0"
description = "Move your files between cloud storage providers, verify every byte, and recycle the originals only once they are proven safe."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Shyden Ltd" }]
keywords = ["cloud", "storage", "migration", "onedrive", "google-drive", "backup"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
    "Typing :: Typed",
]

# Matches the tested matrix exactly. A package installable on a version
# nothing tests is a defect waiting for a bug report.
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "keyring>=25.2",
    "platformdirs>=4.2",
]

[project.urls]
Homepage = "https://github.com/Shyden-Ltd/ShyFerry"
Issues = "https://github.com/Shyden-Ltd/ShyFerry/issues"

[project.scripts]
shyferry = "shyferry.cli.main:app"

# Providers register here. A third party ships one as a separate package and
# ShyFerry finds it at runtime, with no change to this codebase.
[project.entry-points."shyferry.providers"]
local = "shyferry.providers.local:LocalProvider"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.4",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shyferry"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "conformance: the one suite every provider must pass",
    "journey: an end-to-end walk of a user's path through the tool",
]
